	<!-- /HTTP_STYLE -->
	<!-- HTTP_SCRIPT -->
	<script>
		function addElement(newHtml) {
			const newDiv = document.createElement("div");
			newDiv.innerHTML=newHtml;
			const currentDiv = document.getElementById("networkList");
			currentDiv.appendChild(newDiv);
		};

		refreshNetworkList = function() {
			fetch('/api/getWiFiNetworks')
  				.then(response => response.json())
  				.then(data => {
//				  	console.log(data);
					  data.SSIDs.split(',').forEach(network => {
						let networkItem = "<a href='#p' onclick='c(this)'>"+network+"</a>";
						addElement(networkItem);
					});
			  });
		};

		function c(l) {
			document.getElementById('SSID').value = l.innerText || l.textContent;
			document.getElementById('password').focus()
		};

		refreshNetworkList();
	</script>
	<!-- /HTTP_SCRIPT -->
	<!-- HTTP_HEAD_END -->
</head>
