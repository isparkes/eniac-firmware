        <div class="container after-fixed-navbar" role="main">
            <h3 class="sub-header">General options</h3>
            <div class="form-horizontal">
                <div class="form-group">
                    <label class="control-label col-xs-3">12H/24H mode:</label>
                    <div class="col-xs-1">
                        <label class="radio-inline">
                            <input type="radio" name="12h24hMode" id="hourMode" value="on">12H
                        </label>
                    </div>
                    <div class="col-xs-1">
                        <label class="radio-inline">
                            <input checked type="radio" name="12h24hMode" id="hourModeOff" value="off">24H
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3">Blank leading zero:</label>
                    <div class="col-xs-1">
                        <label class="radio-inline">
                            <input type="radio" name="blankLeading" id="blankLeading" value="blank">Blank
                        </label>
                    </div>
                    <div class="col-xs-1">
                        <label class="radio-inline">
                            <input checked type="radio" name="blankLeading" id="blankLeadingOff" value="show">Show
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3">Date format:</label>
                    <div class="col-xs-4">
                        <select class="form-control" name="dateFormat" id="dateFormat">
                            <option value="0">YY-MM-DD</option>
                            <option value="1">MM-DD-YY</option>
                            <option selected value="2">DD-MM-YY</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3">Scrollback effect:</label>
                    <div class="col-xs-1">
                        <label class="radio-inline">
                            <input type="radio" name="scrollback" id="scrollback" value="on" onclick="handleScrollbackClick(this);">On
                        </label>
                    </div>
                    <div class="col-xs-1">
                        <label class="radio-inline">
                            <input checked type="radio" name="scrollback" id="scrollbackOff" value="off" onclick="handleScrollbackClick(this);">Off
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3" for="scrollSteps">Scroll steps:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="scrollSteps" id="scrollSteps" min="1" max="8" value="4" disabled>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3">Fade effect:</label>
                    <div class="col-xs-1">
                        <label class="radio-inline">
                            <input type="radio" name="fade" id="fade" value="on" onclick="handleFadeClick(this);">On
                        </label>
                    </div>
                    <div class="col-xs-1">
                        <label class="radio-inline">
                            <input checked type="radio" name="fade" id="fadeOff" value="off" onclick="handleFadeClick(this);">Off
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3" for="fadeSteps">Fade steps:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="fadeSteps" id="fadeSteps" min="10" max="60" value="25" disabled>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3">Date transition:</label>
                    <div class="col-xs-4">
                        <select class="form-control" name="slotsMode" id="slotsMode">
                            <option value="0">No date display</option>
                            <option selected value="1">Wipe</option>
                            <option selected value="2">Bang</option>
                            <option selected value="3">Scramble</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3">ACP mode:</label>
                    <div class="col-xs-4">
                        <select class="form-control" name="acpMode" id="acpMode">
                            <option value="0">ACP Off</option>
                            <option value="1">ACP Every minute</option>
                            <option selected value="2">ACP Every 10 minutes</option>
                            <option value="3">ACP Every hour</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3">Suppress ACP when dimmed:</label>
                    <div class="col-xs-1">
                        <label class="radio-inline">
                            <input checked type="radio" name="suppressACP" id="suppressACP" value="on">On
                        </label>
                    </div>
                    <div class="col-xs-1">
                        <label class="radio-inline">
                            <input type="radio" name="suppressACP" id="suppressACPOff" value="off">Off
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3">Neon indicators:</label>
                    <div class="col-xs-4">
                        <select class="form-control" name="blinkenLightsMode" id="blinkenLightsMode">
                            <option value="0">Status mode</option>
                            <option value="1">Chase mode</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" id="slaveModeContainer" hidden>
                    <label class="control-label col-xs-3">Slave Mode:</label>
                    <div class="col-xs-4">
                        <select class="form-control" name="slaveMode" id="slaveMode">
                            <option value="0">Show 100ths</option>
                            <option value="1">Show day of month</option>
                            <option value="2">Show seconds</option>
                            <option value="3">Off</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3">Separators:</label>
                    <div class="col-xs-4">
                        <select class="form-control" name="sepMode" id="sepMode">
                            <option value="0">Railroad</option>
                            <option value="1">Railroad US</option>
                            <option value="2">Slow blink</option>
                            <option value="3">Fast blink</option>
                            <option value="4">Double blink</option>
                            <option value="5">Always on</option>
                            <option value="6">Always off</option>
                            <option value="7">AM/PM</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" id="outputConfigContainer" hidden>
                    <label class="control-label col-xs-3" for="outputOnTime" id="outputOnTimeLabel">Effect time:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="outputOnTime" id="outputOnTime" min="0" max="30" value="10">
                    </div>
                </div>

                <div class="form-group">
                    <label class="control-label col-xs-3">WiFi on at start:</label>
                    <div class="col-xs-1">
                        <label class="radio-inline">
                            <input checked type="radio" name="WifiOnAtStart" id="WifiOnAtStartOn" value="on">On
                        </label>
                    </div>
                    <div class="col-xs-1">
                        <label class="radio-inline">
                            <input type="radio" name="WifiOnAtStart" id="WifiOnAtStartOff" value="off">Off
                        </label>
                    </div>
                </div>

                <div class="form-group" id="sw1ModeContainer">
                    <label class="control-label col-xs-3">Switch1:</label>
                    <div class="col-xs-4">
                        <select class="form-control" name="sw1Mode" id="sw1Mode">
                            <option value="0">Not used</option>
                            <option value="1">Shutdown slave</option>
                            <option value="2">Set minimum brightness</option>
                            <option value="3">LEDS off</option>
                            <option value="4">Turn off countdown</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" id="sw2ModeContainer">
                    <label class="control-label col-xs-3">Switch2:</label>
                    <div class="col-xs-4">
                        <select class="form-control" name="sw2Mode" id="sw2Mode">
                            <option value="0">Not used</option>
                            <option value="1">Shutdown slave</option>
                            <option value="2">Set minimum brightness</option>
                            <option value="3">LEDS off</option>
                            <option value="4">Turn off countdown</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" id="pModeContainer">
                    <label class="control-label col-xs-3">Main display</label>
                    <div class="col-xs-4">
                        <select class="form-control" name="pMode" id="pMode">
                            <option value="0">Time</option>
                            <option value="1">Date</option>
                            <option value="2">Value</option>
                            <option id="pModeCountdown" value="3">Countdown</option>
                            <option id="pModeTicker" value="4">Ticker</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" id="sModeContainer">
                    <label class="control-label col-xs-3">Slots display</label>
                    <div class="col-xs-4">
                        <select class="form-control" name="sMode" id="sMode">
                            <option value="0">Time</option>
                            <option value="1">Date</option>
                            <option value="2">Value</option>
                            <option id="sModeCountdown" value="3">Countdown</option>
                            <option id="sModeTicker" value="4">Ticker</option>
                        </select>
                    </div>
                </div>

                <div>
                    <div class="form-group">
                    <div class="col-xs-offset-3 col-xs-9">
                        <input type="submit" class="btn btn-primary" value="Set" onclick="saveConfig()">
                    </div>
                </div>
            </div>
        </div>
        <div class="container" role="main">
            <h3 class="sub-header">Ambient Light Sensor</h3>
            <div class="form-horizontal">

                <!-- tube LDR --> 

                <div class="form-group">
                    <label class="control-label col-xs-3">Sensor Dims Tubes:</label>
                    <div class="col-xs-1">
                        <label class="radio-inline">
                            <input type="radio" name="useLDRTube" id="useLDRTube" value="on" onclick="handleLDRTubeClick(this);">On
                        </label>
                    </div>                    
                    <div class="col-xs-1">
                        <label class="radio-inline">
                            <input type="radio" name="useLDRTube" id="useLDRTubeOff" value="off" onclick="handleLDRTubeClick(this);">Off
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="control-label col-xs-3" for="minTubeDim">Tube Min Dim %:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="minTubeDim" id="minTubeDim" min="1" max="100" value="10">
                    </div>
                </div>

                <div class="form-group">
                    <label class="control-label col-xs-3" for="setTubeDim">Tube Fixed Dim %:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="setTubeDim" id="setTubeDim" min="1" max="100" value="10">
                    </div>
                </div>

                <!-- Backlight LDR --> 

                <div class="form-group">
                    <label class="control-label col-xs-3">Sensor Dims Backlights:</label>
                    <div class="col-xs-1">
                        <label class="radio-inline">
                            <input type="radio" name="useLDRBL" id="useLDRBL" value="on" onclick="handleLDRBLClick(this);">On
                        </label>
                    </div>                    
                    <div class="col-xs-1">
                        <label class="radio-inline">
                            <input type="radio" name="useLDRBL" id="useLDRBLOff" value="off" onclick="handleLDRBLClick(this);">Off
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="control-label col-xs-3" for="minBLDim">Backlight Min Dim %:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="minBLDim" id="minBLDim" min="1" max="100" value="10">
                    </div>
                </div>

                <div class="form-group">
                    <label class="control-label col-xs-3" for="setBLDim">Backlight Fixed Dim %:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="setBLDim" id="setBLDim" min="1" max="100" value="10">
                    </div>
                </div>

                <!-- LDR Sensitivity --> 

                <div class="form-group">
                    <label class="control-label col-xs-3" for="sensitivityLDR">Sensitivity:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="sensitivityLDR" id="sensitivityLDR" min="100" max="400" value="200">
                    </div>
                </div>

                <div class="form-group">
                    <label class="control-label col-xs-3" for="thresholdBright">Threshold:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="thresholdBright" id="thresholdBright" min="0" max="500" value="50">
                    </div>
                </div>

                <div class="form-group">
                    <div class="col-xs-offset-3 col-xs-9">
                        <input type="submit" class="btn btn-primary" value="Set"  onclick="saveConfig()">
                    </div>
                </div>
            </div>
        </div>
        <div class="container" role="main">
            <h3 class="sub-header">Digit blanking</h3>
            <h5 class="sub-header" hidden="" id="mdnotinstalled">Motion detector is not installed!</h5>
            <div class="form-horizontal">
                <div class="form-group">
                    <label class="control-label col-xs-3" for="blankHourStart">Motion Detector Timeout:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="mdTimeout" id="mdTimeout" min="60" max="3600" value="360">
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3">Motion detector priority:</label>
                    <div class="col-xs-8">
                        <select class="form-control" name="mdBlankMode" id="mdBlankMode">
                            <option selected value="0">Motion detector overrides day blanking</option>
                            <option value="1">Motion detector follows day blanking</option>
                            <option value="2">Disable motion detector</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3">Day blanking:</label>
                    <div class="col-xs-4">
                        <select class="form-control" name="dayBlanking" id="dayBlanking" onChange="handleDayBlankingChange()">
                            <option selected value="0">Never blank</option>
                            <option value="1">Blank all day on weekends</option>
                            <option value="2">Blank all day on week days</option>
                            <option value="3">Blank always</option>
                            <option value="4">Blank during selected hours every day</option>
                            <option value="5">Blank during selected hours on week days and all day on weekends</option>
                            <option value="6">Blank during selected hours on weekends and all day on week days</option>
                            <option value="7">Blank during selected hours on weekends only</option>
                            <option value="8">Blank during selected hours on week days only</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3">Blank Mode:</label>
                    <div class="col-xs-4">
                        <select class="form-control" name="blankMode" id="blankMode">
                            <option value="0">Blank tubes only</option>
                            <option value="1">Blank LEDs only</option>
                            <option selected value="2">Blank tubes and LEDs</option>
                            <option value="3">Blank tubes and LEDs and separators</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3" for="blankHourStart">Blank from:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="blankHourStart" id="blankHourStart" min="0" max="23" value="0" disabled>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3" for="blankHourEnd">Blank to:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="blankHourEnd" id="blankHourEnd" min="0" max="23" value="7" disabled>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-xs-offset-3 col-xs-9">
                        <input type="submit" class="btn btn-primary" value="Set" onclick="saveConfig()">
                    </div>
                </div>
            </div>
        </div>

        <div class="container" role="main" id="countdownpanel" hidden>
            <h3 class="sub-header">Countdown</h3>
            <div class="form-horizontal">
                <div class="form-group">
                    <label class="control-label col-xs-3" for="countdownTarget">Countdown target date:</label>
                    <div class="col-xs-2">
                        <input type="date" class="form-control" id="countdownTarget" name="countdownTarget" value="2023-01-18"
                        min="2022-01-01" max="2030-12-31">
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-xs-offset-3 col-xs-9">
                        <input type="submit" class="btn btn-primary" value="Set" onclick="saveConfig()">
                    </div>
                </div>
            </div>
        </div>

        <div class="container" role="main">
            <h3 class="sub-header">Under Digit Lighting</h3>
            <div class="form-horizontal">
                <div class="form-group">
                    <label class="control-label col-xs-3">Back light pattern:</label>
                    <div class="col-xs-4">
                        <select class="form-control" name="backlightMode" id="backlightMode" onChange="handleDayBacklightModeChange()">
                            <option value="0">Fixed RGB backlight</option>
                            <option value="1">Cycling RGB backlight</option>
                            <option value="2">Colortime RGB backlight</option>
                            <option value="3">Day of Week RGB backlight</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3" for="redCnl">Red intensity:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="redCnl" id="redCnl" min="0" max="15" value="15" disabled>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3" for="grnCnl">Green intensity:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="grnCnl" id="grnCnl" min="0" max="15" value="0" disabled>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3" for="bluCnl">Blue intensity:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="bluCnl" id="bluCnl" min="0" max="15" value="0" disabled>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3">Dim Backlights:</label>
                    <div class="col-xs-1">
                        <label class="radio-inline">
                            <input type="radio" name="useBLDim" id="useBLDim" value="on">On
                        </label>
                    </div>
                    <div class="col-xs-1">
                        <label class="radio-inline">
                            <input type="radio" name="useBLDim" id="useBLDimOff" value="off">Off
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3">Pulse Backlights:</label>
                    <div class="col-xs-1">
                        <label class="radio-inline">
                            <input type="radio" name="useBLPulse" id="useBLPulse" value="on">On
                        </label>
                    </div>
                    <div class="col-xs-1">
                        <label class="radio-inline">
                            <input type="radio" name="useBLPulse" id="useBLPulseOff" value="off">Off
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="control-label col-xs-3" for="cycleSpeed">Backlight Cycle Speed:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="cycleSpeed" id="cycleSpeed" min="1" max="10" value="5">
                    </div>
                </div>

                <div class="form-group">
                    <label class="control-label col-xs-3" for="cycleSpeed">Backlight Dim Factor:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="backlightDimFactor" id="backlightDimFactor" min="10" max="100" value="100">
                    </div>
                </div>

                <div class="form-group">
                    <label class="control-label col-xs-3" for="hueOffset">Nixie Pair Colour Offset:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="hueOffset" id="hueOffset" min="0" max="360" step="10" value="30">
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3" for="towerHueOffset">Tower Colour:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="towerHueOffset" id="towerHueOffset" min="0" max="360" step="10" value="0">
                    </div>
                </div>
                <div class="form-group">
                    <label class="control-label col-xs-3" for="backlightGradient">Rainbow effect:</label>
                    <div class="col-xs-2">
                        <input type="number" class="form-control" name="backlightGradient" id="backlightGradient" min="0" max="360" step="10" value="0">
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-xs-offset-3 col-xs-9">
                        <input type="submit" class="btn btn-primary" value="Set"  onclick="saveConfig()">
                    </div>
                </div>
            </div>
        </div>

                    <div class="col-xs-offset-3 col-xs-9">
                        <input type="submit" class="btn btn-primary" value="Set"  onclick="saveConfig()">
                    </div>
                </div>
            </div>
        </div>
        -->
    </body>

<script>
    var localConfig;
    getClockConfig = function getClockConfig() {
        var deferred = $.Deferred();
        console.log('get clock values');
        var ajaxOptions = {
            url: '/api/getConfig',
            type: 'GET',
            Accept: 'application/json; charset=utf-8'
        };
        $.ajax(ajaxOptions).done(function (config) {
            console.log("Received data: " + JSON.stringify(config));
            deferred.resolve(config);
        }).fail(function (jqXHR) {
            console.log("Get api error " + jqXHR.status);
            deferred.reject(jqXHR.status);
        });
        return deferred;
    };

    getConfig = function () {
        getClockConfig().then(function (config) {
            setWidgets(config);
            removeLoader();
        })
    }

    setWidgets = function(config) {
        localConfig = config;

        // -------------- General --------------
        setCurrentRadioValue("#hourMode", "#hourModeOff", config.hourMode);
        setCurrentRadioValue("#blankLeading", "#blankLeadingOff", config.blankLeading);
        $("#dateFormat").val(config.dateFormat);
        setCurrentRadioValue("#scrollback", "#scrollbackOff", config.scrollback);
        $("#scrollSteps").val(config.scrollSteps);
        setCurrentRadioValue("#fade", "#fadeOff", config.fade);
        $("#fadeSteps").val(config.fadeSteps);
        $("#slotsMode").val(config.slotsMode);
        $("#acpMode").val(config.acpMode);
        setCurrentRadioValue("#suppressACP", "#suppressACPOff", config.suppressACP);
        $("#blinkenLightsMode").val(config.blinkenLightsMode);
        $("#sepMode").val(config.sepMode);
        $("#sw1Mode").val(config.sw1Mode);
        $("#sw2Mode").val(config.sw2Mode);
        $("#pMode").val(config.pMode);
        $("#sMode").val(config.sMode);

        // ------------ Tube Dim ------------
        setCurrentRadioValue("#useLDRTube", "#useLDRTubeOff", config.useLDRTube);
        $("#minTubeDim").val(config.minTubeDim);
        $("#setTubeDim").val(config.setTubeDim);

        // ------------ LED Dim ------------
        setCurrentRadioValue("#useLDRBL", "#useLDRBLOff", config.useLDRBL);
        $("#minBLDim").val(config.minBLDim);
        $("#setBLDim").val(config.setBLDim);
        
        $("#sensitivityLDR").val(config.sensitivityLDR);
        $("#thresholdBright").val(config.thresholdBright);

        // ------------ Blanking ------------
        if (config.mdinstalled == false) {
            $("#mdnotinstalled").prop('hidden', false);
            $("#mdTimeout").prop('disabled', true);
            $("#mdBlankMode").prop('disabled', true);
        }
        $("#mdTimeout").val(config.mdTimeout);
        $("#mdBlankMode").val(config.mdBlankMode);
        $("#dayBlanking").val(config.dayBlanking);
        $("#blankMode").val(config.blankMode);
        $("#blankHourStart").val(config.blankHourStart);
        $("#blankHourEnd").val(config.blankHourEnd);

        // -------------- LEDs --------------
        $("#backlightMode").val(config.backlightMode);
        $("#redCnl").val(config.redCnl);
        $("#grnCnl").val(config.grnCnl);
        $("#bluCnl").val(config.bluCnl);
        setCurrentRadioValue("#useBLDim", "#useBLDimOff", config.useBLDim);
        setCurrentRadioValue("#useBLPulse", "#useBLPulseOff", config.useBLPulse);
        $("#cycleSpeed").val(config.cycleSpeed);
        $("#backlightDimFactor").val(config.backlightDimFactor);
        $("#hueOffset").val(config.hueOffset);
        $("#towerHueOffset").val(config.towerHueOffset);
        $("#backlightGradient").val(config.backlightGradient);
        
        // -- Conditional elements --
        if (typeof config.outputOnTime !== 'undefined') {
            $("#outputConfigContainer").prop('hidden', false);
            $("#outputOnTime").val(config.outputOnTime);
        }

        if (typeof config.countdownTarget !== 'undefined') {
            $("#countdownpanel").prop('hidden', false);
            $("#countdownTarget").val(config.countdownTarget);
        }

        if (typeof config.slaveMode !== 'undefined') {
            $("#slaveModeContainer").prop('hidden', false);
            $("#slaveMode").val(config.slaveMode);
        }

        // -- Triggers for dependent settings --
        handleScrollbackClick($("#scrollback"));
        handleFadeClick($("#fade"));
        handleLDRTubeClick($("#useLDRTube"));
        handleLDRBLClick($("#useLDRBL"));
        handleDayBlankingChange();
        handleDayBacklightModeChange();
        handleCountdownDisplayOption();
    };

    postConfig = function postConfig() {
        var deferred = $.Deferred();
        console.log('post config values');

        var postBody = {
        };

        // -------------- General --------------
        if (compareRadioChanged("#hourMode", localConfig.hourMode)) {
            postBody["hourMode"] = getCurrentRadioValue("#hourMode");
        }

        if (compareRadioChanged("#blankLeading", localConfig.blankLeading)) {
            postBody["blankLeading"] = getCurrentRadioValue("#blankLeading");
        }

        if (localConfig.dateFormat != $("#dateFormat").val()) {
            postBody["dateFormat"] = $("#dateFormat").val();
        }

        if (compareRadioChanged("#scrollback", localConfig.scrollback)) {
            postBody["scrollback"] = getCurrentRadioValue("#scrollback");
        }

        if (localConfig.scrollSteps != $("#scrollSteps").val()) {
            postBody["scrollSteps"] = $("#scrollSteps").val();
        }

        if (compareRadioChanged("#fade", localConfig.fade)) {
            postBody["fade"] = getCurrentRadioValue("#fade");
        }

        if (localConfig.fadeSteps != $("#fadeSteps").val()) {
            postBody["fadeSteps"] = $("#fadeSteps").val();
        }

        if (localConfig.slotsMode!=$("#slotsMode").val()) {
            postBody["slotsMode"] = $("#slotsMode").val();
        }

        if (localConfig.acpMode!=$("#acpMode").val()) {
            postBody["acpMode"] = $("#acpMode").val();
        }

        if (compareRadioChanged("#suppressACP", localConfig.suppressACP)) {
            postBody["suppressACP"] = getCurrentRadioValue("#suppressACP");
        }

        if (compareRadioChanged("#WifiOnAtStart", localConfig.WifiOnAtStart)) {
            postBody["WifiOnAtStart"] = getCurrentRadioValue("#WifiOnAtStart");
        }

        if (localConfig.sw1Mode!=$("#sw1Mode").val()) {
            postBody["sw1Mode"] = $("#sw1Mode").val();
        }

        if (localConfig.sw2Mode!=$("#sw2Mode").val()) {
            postBody["sw2Mode"] = $("#sw2Mode").val();
        }

        if (localConfig.pMode!=$("#pMode").val()) {
            postBody["pMode"] = $("#pMode").val();
        }

        if (localConfig.sMode!=$("#sMode").val()) {
            postBody["sMode"] = $("#sMode").val();
        }

        // -------------- LDR --------------

        if (compareRadioChanged("#useLDRTube", localConfig.useLDRTube)) {
            postBody["useLDRTube"] = getCurrentRadioValue("#useLDRTube");
        }

        if (localConfig.minTubeDim!=$("#minTubeDim").val()) {
            postBody["minTubeDim"] = $("#minTubeDim").val();
        }

        if (localConfig.setTubeDim!=$("#setTubeDim").val()) {
            postBody["setTubeDim"] = $("#setTubeDim").val();
        }

        if (compareRadioChanged("#useLDRBL", localConfig.useLDRBL)) {
            postBody["useLDRBL"] = getCurrentRadioValue("#useLDRBL");
        }

        if (localConfig.minBLDim!=$("#minBLDim").val()) {
            postBody["minBLDim"] = $("#minBLDim").val();
        }

        if (localConfig.setTubeDim!=$("#setBLDim").val()) {
            postBody["setBLDim"] = $("#setBLDim").val();
        }

        if (localConfig.sensitivityLDR!=$("#sensitivityLDR").val()) {
            postBody["sensitivityLDR"] = $("#sensitivityLDR").val();
        }

        if (localConfig.thresholdBright!=$("#thresholdBright").val()) {
            postBody["thresholdBright"] = $("#thresholdBright").val();
        }
       // ------------ Blanking ------------
        if (localConfig.mdTimeout!=$("#mdTimeout").val()) {
            postBody["mdTimeout"] = $("#mdTimeout").val();
        }

        if (localConfig.mdBlankMode!=$("#mdBlankMode").val()) {
            postBody["mdBlankMode"] = $("#mdBlankMode").val();
        }

        if (localConfig.dayBlanking!=$("#dayBlanking").val()) {
            postBody["dayBlanking"] = $("#dayBlanking").val();
        }

        if (localConfig.blankMode!=$("#blankMode").val()) {
            postBody["blankMode"] = $("#blankMode").val();
        }

        if (localConfig.blankHourStart!=$("#blankHourStart").val()) {
            postBody["blankHourStart"] = $("#blankHourStart").val();
        }

        if (localConfig.blankHourEnd!=$("#blankHourEnd").val()) {
            postBody["blankHourEnd"] = $("#blankHourEnd").val();
        }

        // -------------- LEDs --------------
        if (localConfig.backlightMode!=$("#backlightMode").val()) {
            postBody["backlightMode"] = $("#backlightMode").val();
        }

        if (localConfig.redCnl!=$("#redCnl").val()) {
            postBody["redCnl"] = $("#redCnl").val();
        }

        if (localConfig.grnCnl!=$("#grnCnl").val()) {
            postBody["grnCnl"] = $("#grnCnl").val();
        }

        if (localConfig.bluCnl!=$("#bluCnl").val()) {
            postBody["bluCnl"] = $("#bluCnl").val();
        }

        if (compareRadioChanged("#useBLDim", localConfig.useBLDim)) {
            postBody["useBLDim"] = getCurrentRadioValue("#useBLDim");
        }

        if (compareRadioChanged("#useBLPulse", localConfig.useBLPulse)) {
            postBody["useBLPulse"] = getCurrentRadioValue("#useBLPulse");
        }

        if (localConfig.cycleSpeed!=$("#cycleSpeed").val()) {
            postBody["cycleSpeed"] = $("#cycleSpeed").val();
        }

        if (localConfig.backlightDimFactor!=$("#backlightDimFactor").val()) {
            postBody["backlightDimFactor"] = $("#backlightDimFactor").val();
        }
        
        if (localConfig.hueOffset!=$("#hueOffset").val()) {
            postBody["hueOffset"] = $("#hueOffset").val();
        }

        if (localConfig.towerHueOffset!=$("#towerHueOffset").val()) {
            postBody["towerHueOffset"] = $("#towerHueOffset").val();
        }

        if (localConfig.backlightGradient!=$("#backlightGradient").val()) {
            postBody["backlightGradient"] = $("#backlightGradient").val();
        }

        if (localConfig.blinkenLightsMode!=$("#blinkenLightsMode").val()) {
            postBody["blinkenLightsMode"] = $("#blinkenLightsMode").val();
        }

        if ((typeof localConfig.slaveMode!=='undefined') && (localConfig.slaveMode!=$("#slaveMode").val())) {
            postBody["slaveMode"] = $("#slaveMode").val();
        }

        if (localConfig.sepMode!=$("#sepMode").val()) {
            postBody["sepMode"] = $("#sepMode").val();
        }

        if ((typeof localConfig.outputOnTime!=='undefined') && (localConfig.outputOnTime!=$("#outputOnTime").val())) {
            postBody["outputOnTime"] = $("#outputOnTime").val();
        }

        if ((typeof localConfig.countdownTarget!=='undefined') && (localConfig.countdownTarget!=$("#countdownTarget").val())) {
            postBody["countdownTarget"] = $("#countdownTarget").val();
        }

        // ----------------------------------

        var ajaxOptions = {
            url: '/api/postConfig',
            type: 'POST',
            data: JSON.stringify(postBody)
        };
        $.ajax(ajaxOptions).done(function (res) {
            console.log("Saved config");
            deferred.resolve(res);
        }).fail(function (jqXHR) {
            console.log("Post api error " + jqXHR.status);
            deferred.reject(jqXHR.status);
        });
        return deferred;
    };

    saveConfig = function () {
        addLoader();
        postConfig()
        .then(function (config) {
            console.log("Saved config");
            setWidgets(config)
            removeLoader();
        });
    };

    function addLoader() {
        $('body').append('<div style="" id="loadingDiv"><div class="loader">Loading...</div></div>');
    }

    function removeLoader() {
        $("#loadingDiv").fadeOut(500, function () {
            $("#loadingDiv").remove();
        });
    }

    function compareRadioChanged(radioID, originalValue) {
        return $(radioID).prop('checked') != originalValue
    }

    function getCurrentRadioValue(radioID) {
        return $(radioID).prop('checked');
    }

    function setCurrentRadioValue(radioID, radioIDOff, newValue) {
        if (newValue) {
            $(radioID).prop('checked', true);
        } else {
            $(radioIDOff).prop('checked', true);
        }
    }

    function handleScrollbackClick(radioID) {
        if($(radioID).prop('checked') && $(radioID).val() == 'on') {
            $("#scrollSteps").prop('disabled', false);
        } else {
            $("#scrollSteps").prop('disabled', true);
        }
    }

    function handleFadeClick(radioID) {
        if($(radioID).prop('checked') && $(radioID).val() == 'on') {
            $("#fadeSteps").prop('disabled', false);
        } else {
            $("#fadeSteps").prop('disabled', true);
        }
    }

    function handleLDRTubeClick(radioID) {
        if($(radioID).prop('checked') && $(radioID).val() == 'on') {
            $("#minTubeDim").prop('disabled', false);
            $("#setTubeDim").prop('disabled', true);
        } else {
            $("#minTubeDim").prop('disabled', true);
            $("#setTubeDim").prop('disabled', false);
        }
    }

    function handleLDRBLClick(radioID) {
        if($(radioID).prop('checked') && $(radioID).val() == 'on') {
            $("#minBLDim").prop('disabled', false);
            $("#setBLDim").prop('disabled', true);
        } else {
            $("#minBLDim").prop('disabled', true);
            $("#setBLDim").prop('disabled', false);
        }
    }

    function handleDayBlankingChange() {
        if ($("#dayBlanking").val() > 3) {
            $("#blankHourStart").prop('disabled', false);
            $("#blankHourEnd").prop('disabled', false);
        } else {
            $("#blankHourStart").prop('disabled', true);
            $("#blankHourEnd").prop('disabled', true);
        }
    }

    function handleDayBacklightModeChange() {
        // Fixed backlights use the thrre colours
        if ($("#backlightMode").val() == 0) {
            $("#redCnl").prop('disabled', false);
            $("#grnCnl").prop('disabled', false);
            $("#bluCnl").prop('disabled', false);
        } else {
            $("#redCnl").prop('disabled', true);
            $("#grnCnl").prop('disabled', true);
            $("#bluCnl").prop('disabled', true);
        }

        // cycle enables the cycle speed
        if ($("#backlightMode").val() == 1) {
            $("#cycleSpeed").prop('disabled', false);
        } else {
            $("#cycleSpeed").prop('disabled', true);
        }
        // Colourtime does not work with rainnbow effect
        if ($("#backlightMode").val() == 2) {
            $("#backlightGradient").prop('disabled', true);
        } else {
            $("#backlightGradient").prop('disabled', false);
        }
    }

    function handleCountdownDisplayOption() {
        // If the countdown date is in the past, disable the options in the display selector
        if ((typeof localConfig.countdownTarget === 'undefined') || Date.parse($("#countdownTarget").val()) < Date.now()) {
            console.log("Disabling countdown options");
            $("#pModeCountdown").prop('disabled', true);
            $("#sModeCountdown").prop('disabled', true);
        } else {
            console.log("Enabling countdown options");
            $("#pModeCountdown").prop('disabled', false);
            $("#sModeCountdown").prop('disabled', false);
        }
    }

    addLoader();
    getConfig();
    
</script>

</html>
