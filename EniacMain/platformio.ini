; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = ESP32 RZ568M ProperDrive Clock
default_envs = esp32-rz568

[env:esp32-rz568]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
build_flags = -Os -DELEGANTOTA_USE_ASYNC_WEBSERVER=1

; Flash settings 4MB - default
board_build.partitions = default.csv
board_upload.flash_size = 4MB

; Flash settings 4MB - for Eric
; board_build.partitions = eniac4MBEric.csv
; board_upload.flash_size = 4MB

; Flash settings 4MB - reduced SPIFFS
; board_build.partitions = eniac4MB.csv
; board_upload.flash_size = 4MB

; Flash settings 8MB
; board_build.partitions = eniac8MB.csv
; board_upload.flash_size = 8MB
; board_upload.maximum_size = 8388608

; Flash settings 16MB
; board_build.partitions = eniac16MB.csv
; board_upload.flash_size  = 16MB
; board_upload.maximum_size = 16777216

; Flash settings 16MB Eger
; board_build.partitions = eniac16MBEger.csv
; board_upload.flash_size  = 16MB
; board_upload.maximum_size = 16777216

; Linux
; upload_port = /dev/ttyUSB*
; monitor_port = /dev/ttyUSB*

; Mac
upload_port = /dev/cu.usbserial*
monitor_port = /dev/cu.usbserial*

; upload_speed = 115200
monitor_speed = 115200

lib_deps =
	paulstoffregen/Time@^1.6.1
	bblanchon/ArduinoJson@5.13.4
	adafruit/Adafruit GFX Library@^1.12.5
	adafruit/Adafruit SSD1306@^2.5.16
	adafruit/Adafruit BusIO@^1.13.2
	makuna/NeoPixelBus@^2.8.4
	adafruit/Adafruit SH110X@^2.1.14
	ayushsharma82/ElegantOTA@^3.1.7
	esp32async/ESPAsyncWebServer@^3.10.3
